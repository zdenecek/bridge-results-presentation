name: Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - frontend/**
      - api/**
    branches:
      - main

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1  
      - name: Create .env file
        run: |
          echo "${{ secrets.FRONTEND_ENV }}" >> ./frontend/.env
      - name: Write Gemini config
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY not set, skipping"; exit 0; fi
          if ! printf '%s' "$GEMINI_API_KEY" | grep -Eq '^[A-Za-z0-9_-]+$'; then echo "Unexpected characters in GEMINI_API_KEY"; exit 1; fi
          printf "<?php\nreturn ['key' => '%s'];\n" "$GEMINI_API_KEY" > api/gemini-config.php
      - name: Build
        working-directory: ./frontend
        run: | 
          npm install
          npm run build --production
      - name: Upload via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_LOGIN: ${{ secrets.FTP_LOGIN }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          host="${FTP_SERVER#*://}"
          host="${host%%/*}"

          trap 'rm -f "$HOME/.netrc"' EXIT
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "${host%%:*}" "$FTP_LOGIN" "$FTP_PASSWORD" > "$HOME/.netrc"

          lftp "ftp://${FTP_LOGIN}@${host}" -e "
            set ftp:ssl-allow true;
            set ssl:verify-certificate true;
            set ssl:check-hostname true;
            set ftp:passive-mode true;
            set ftp:use-feat false;
            set net:max-retries 1;
            set net:persist-retries 5;
            set net:timeout 15s;
            mirror --continue --reverse --verbose=1 --no-symlinks ./frontend/dist ./app;
            set cmd:fail-exit yes;
            cls api/public/index.php;
            mirror --reverse --verbose=1 --no-symlinks --exclude-glob vendor/ --exclude-glob config.php --exclude-glob composer.* --exclude-glob .gitignore ./api ./api;
            bye"
