name: Deploy

on:
  workflow_dispatch:
  push:
    paths:
      - frontend/**
      - api/**
    branches:
      - main

jobs:
  build:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Setup node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: get-npm-version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1  
      - name: Create .env file
        run: |
          echo "${{ secrets.FRONTEND_ENV }}" >> ./frontend/.env
      - name: Build
        working-directory: ./frontend
        run: | 
          npm install
          npm run build --production
      - name: Upload via FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_LOGIN: ${{ secrets.FTP_LOGIN }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          host="${FTP_SERVER#*://}"
          host="${host%%/*}"

          trap 'rm -f "$HOME/.netrc"' EXIT
          umask 077
          printf 'machine %s\nlogin %s\npassword %s\n' \
            "${host%%:*}" "$FTP_LOGIN" "$FTP_PASSWORD" > "$HOME/.netrc"

          lftp "ftp://${FTP_LOGIN}@${host}" -e "
            set ftp:ssl-allow true;
            set ssl:verify-certificate true;
            set ssl:check-hostname true;
            set ftp:passive-mode true;
            set ftp:use-feat false;
            set net:max-retries 1;
            set net:persist-retries 5;
            set net:timeout 15s;
            mirror --continue --reverse --verbose=1 --no-symlinks ./frontend/dist ./app;
            bye"
